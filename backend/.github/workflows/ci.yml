name: OFAS Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  FLASK_ENV: testing

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run flake8
        run: flake8 app/ tests/

      - name: Run mypy
        run: mypy app/ --ignore-missing-imports

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ofas_test
          POSTGRES_USER: ofas
          POSTGRES_PASSWORD: ofas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofas -d ofas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run database migrations
        run: |
          export DATABASE_URL=postgresql://ofas:ofas@localhost:5432/ofas_test
          python -m alembic upgrade head
        working-directory: ./backend

      - name: Run unit tests
        run: |
          export DATABASE_URL=postgresql://ofas:ofas@localhost:5432/ofas_test
          pytest tests/unit -v --cov=app --cov-report=xml
        working-directory: ./backend

      - name: Run integration tests
        run: |
          export DATABASE_URL=postgresql://ofas:ofas@localhost:5432/ofas_test
          pytest tests/integration -v
        working-directory: ./backend

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: unittests

  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build -t ofas-backend:test ./backend

      - name: Run container test
        run: |
          docker run --rm -d --name ofas-test -p 5000:5000 \
            -e DATABASE_URL=sqlite:///:memory: \
            -e FLASK_ENV=testing \
            ofas-backend:test

          sleep 10

          curl -f http://localhost:5000/health

          docker stop ofas-test

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploy to staging..."
          # Add your deployment commands here